name: Astro upgrade

# ─── How this workflow fires ────────────────────────────────────────────────
#
# Two triggers:
#
#   workflow_call     — called from a product repo's own astro-upgrade.yml
#                        caller, which supplies the schedule (schedule events
#                        only fire in the repo that owns the workflow file,
#                        so each consuming repo needs a thin caller).
#
#   workflow_dispatch — manual run, for testing this workflow standalone.

on:
  workflow_call:
    inputs:
      working-directory:
        description: "Path to the astro project (contains package.json)"
        type: string
        default: "docs-site"
      node-version:
        description: "Node.js version to run the upgrade with"
        type: string
        default: "24"
  workflow_dispatch:
    inputs:
      working-directory:
        description: "Path to the astro project (contains package.json)"
        type: string
        default: "docs-site"
      node-version:
        description: "Node.js version to run the upgrade with"
        type: string
        default: "24"

permissions:
  contents: write
  pull-requests: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}

      - name: Run astro upgrade
        run: npx @astrojs/upgrade --yes

      - name: Open PR if anything changed
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "Upgrade astro via @astrojs/upgrade"
          title: "chore(${{ inputs.working-directory }}): astro upgrade"
          body: |
            Automated run of `npx @astrojs/upgrade --yes` in `${{ inputs.working-directory }}/`.

            Review the diff before merging — this is the project's standard
            upgrade path and keeps astro plus its official integrations in sync,
            instead of piecemeal dependabot bumps.
          branch: astro-upgrade/automated
          base: main
          labels: dependencies
