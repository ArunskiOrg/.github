name: PR Standards

# ─── How this workflow fires ────────────────────────────────────────────────
#
# Two triggers:
#
#   workflow_call   — called from a product repo's own pr-standards.yml caller.
#                     The caller passes its event through, so the event_name
#                     seen here is whatever triggered the caller (pull_request).
#
#   pull_request    — fires directly when this reusable workflow is used
#                     standalone (e.g. on this repo's own PRs).

on:
  workflow_call:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read
  issues: read

jobs:
  standards:
    name: PR standards
    runs-on: ubuntu-slim
    steps:
      - name: 'Check title matches "#<number>: <description>"'
        id: title
        continue-on-error: true
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if ! echo "$TITLE" | grep -qE '^#[0-9]+: .{5,}'; then
            echo "::error::PR title must match '#<story-number>: <description>'"
            echo "::error::Example: '#42: Add /query endpoint with Bedrock synthesis'"
            echo "::error::Got: $TITLE"
            exit 1
          fi

      # dependabot has its own format, so ignore dependabot-style branch names
      - name: Check required template sections are present
        id: body
        continue-on-error: true
        if: "!startsWith(github.head_ref, 'dependabot/')"
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          missing=()
          for section in "## What changed" "## How to test locally" "## How to test in QA" "## Tests completed" "## Standards checklist"; do
            if ! echo "$BODY" | grep -qF "$section"; then
              missing+=("$section")
            fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::PR body is missing required sections from the PR template:"
            for s in "${missing[@]}"; do
              echo "::error::  $s"
            done
            echo "::error::See https://github.com/ArunskiOrg/.github/blob/main/PULL_REQUEST_TEMPLATE.md"
            exit 1
          fi

      # Both checks above ran with continue-on-error so each reports individually,
      # instead of the job stopping at the first failure. Provide per-check
      # visibility here.
      - name: Fail if any check failed
        if: always()
        run: |
          failed=0
          check() {
            if [ "$2" != "success" ] && [ "$2" != "skipped" ]; then
              echo "FAILED: $1 ($2)"
              failed=1
            fi
          }
          check "title" "${{ steps.title.outcome }}"
          check "body" "${{ steps.body.outcome }}"
          exit $failed
