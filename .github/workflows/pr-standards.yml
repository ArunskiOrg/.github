name: PR Standards

# ─── How this workflow fires ────────────────────────────────────────────────
#
# Three triggers:
#
#   workflow_call   — called from a product repo's own pr-standards.yml caller.
#                     The caller passes its event through, so the event_name
#                     seen here is whatever triggered the caller (pull_request
#                     or issue_comment).
#
#   pull_request    — fires directly when this reusable workflow is used
#                     standalone (e.g. on this repo's own PRs).
#
#   issue_comment   — PR comments on GitHub are modeled as issue comments.
#                     When a comment is posted on a PR, this trigger fires so
#                     that trigger-on-comment can re-run the last pull_request
#                     run, updating the PR status check to reflect the new
#                     comment state (e.g. a sign-off was just posted).
#
#                     types includes "deleted" intentionally: if a sign-off
#                     comment is deleted, the re-run re-evaluates and the check
#                     reverts to failing rather than showing a stale pass.

on:
  workflow_call:
  pull_request:
    types: [opened, edited, reopened, synchronize]
  issue_comment:
    types: [created, edited, deleted]

# ─── Permissions model ──────────────────────────────────────────────────────
#
# GitHub Actions tokens are scoped by a permissions block. Job-level blocks
# REPLACE (not extend) the workflow-level block for that job. This means every
# job that needs pull-requests or issues access must either:
#   (a) inherit from the workflow-level block (by not declaring its own), or
#   (b) explicitly re-declare those permissions alongside any extras it needs.
#
# Workflow-level default (inherited by title, body, standards-review):
#   pull-requests: read  — gh api calls against PR metadata
#   issues: read         — gh api calls against issue comments
#
# trigger-on-comment overrides this block (see job-level permissions below)
# and must therefore re-declare all three permissions it needs.

permissions:
  pull-requests: read
  issues: read

jobs:
  trigger-on-comment:
    # Only fire on comments that belong to a PR (not plain issue comments).
    # github.event.issue.pull_request is populated only on PR-associated issues.
    if: github.event_name == 'issue_comment' && github.event.issue.pull_request != null
    runs-on: ubuntu-latest
    # No author-association guard: any commenter (including bots) can trigger a
    # re-run. This is intentional — sign-off detection is idempotent and
    # Actions minutes are not a concern on this private repo.
    permissions:
      # Job-level permissions REPLACE the workflow-level block entirely.
      # Re-declare pull-requests and issues here, otherwise gh api calls in
      # this job will get HTTP 403 — the token won't have those scopes.
      pull-requests: read
      issues: read
      actions: write  # required for gh run rerun
    steps:
      - name: Re-run PR Standards on the PR head commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          PR_BRANCH=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '.head.ref')
          RUN_ID=$(gh run list \
            --repo "$REPO" \
            --workflow "pr-standards.yml" \
            --branch "$PR_BRANCH" \
            --event pull_request \
            --status completed \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId')
          if [[ "$RUN_ID" =~ ^[0-9]+$ ]]; then
            gh run rerun "$RUN_ID" --repo "$REPO" || \
              echo "::warning::Could not re-run $RUN_ID"
          else
            echo "::warning::No completed pull_request run found for branch $PR_BRANCH — skipping rerun"
          fi

  title:
    name: PR title format
    if: github.event_name != 'issue_comment'
    runs-on: ubuntu-latest
    steps:
      - name: 'Check title matches "#<number>: <description>"'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if ! echo "$TITLE" | grep -qE '^#[0-9]+: .{5,}'; then
            echo "::error::PR title must match '#<story-number>: <description>'"
            echo "::error::Example: '#42: Add /query endpoint with Bedrock synthesis'"
            echo "::error::Got: $TITLE"
            exit 1
          fi

  body:
    name: PR body sections
    if: github.event_name != 'issue_comment'
    runs-on: ubuntu-latest
    steps:
      - name: Check required template sections are present
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          missing=()
          for section in "## What changed" "## How to test locally" "## How to test in QA" "## Tests completed" "## Standards checklist"; do
            if ! echo "$BODY" | grep -qF "$section"; then
              missing+=("$section")
            fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::PR body is missing required sections from the PR template:"
            for s in "${missing[@]}"; do
              echo "::error::  $s"
            done
            echo "::error::See https://github.com/ArunskiOrg/RandomOrganizer2026/blob/main/.github/pull_request_template.md"
            exit 1
          fi

  standards-review:
    name: Standards review sign-off
    runs-on: ubuntu-latest
    steps:
      - name: Check for /standards-review sign-off comment after latest commit
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
        run: |
          if [ "${{ github.event_name }}" = "issue_comment" ]; then
            PR_NUMBER="${{ github.event.issue.number }}"
            PR_HEAD_SHA=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '.head.sha')
          fi
          commit_time=$(gh api "repos/$REPO/commits/$PR_HEAD_SHA" --jq '.commit.committer.date')
          if [ -z "$commit_time" ]; then
            echo "::error::Could not retrieve commit timestamp for $PR_HEAD_SHA."
            exit 1
          fi
          signed_off=$(gh api --paginate "repos/$REPO/issues/$PR_NUMBER/comments" \
            | jq -s --arg t "$commit_time" \
            '[.[][] | select(.body | contains("standards review signed off by /standards-review")) | select(.created_at > $t)] | length')
          if [ "$signed_off" -eq 0 ]; then
            echo "::error::No standards review sign-off found after the latest commit ($PR_HEAD_SHA)."
            echo "::error::Run /standards-review in Claude Code to review the PR and post the sign-off comment."
            exit 1
          fi
