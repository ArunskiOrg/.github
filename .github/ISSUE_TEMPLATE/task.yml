name: Task
description: A sub-unit of a story — a discrete piece of implementation work.
title: "[Task] "
labels: ["task"]
body:
  - type: input
    id: parent-story
    attributes:
      label: Parent story
      description: Link to the parent Story issue.
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What needs to be done?
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Notes
    validations:
      required: false
